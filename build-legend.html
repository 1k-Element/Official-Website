<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Build Legend — Construction Accounting</title>
<meta name="description" content="Journal-driven construction accounting: post one journal entry and project cost sheets, supplier and worker ledgers, billings, payables, bank balances and financial statements update themselves." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181d; --ink-2:#22252c; --ink-3:#31353e;
  --canvas:#eeeeea; --surface:#ffffff; --line:#e2dfd8; --line-2:#f0ede7;
  --text:#1b1d22; --muted:#6f6b62; --faint:#9a958c;
  --amber:#ffc42e; --amber-2:#ffd45f; --amber-ink:#8a5c00;
  --pos:#0f7a4a; --neg:#b3261e; --blue:#1f4e79;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"cv05" 1;
}
button,input,select,textarea{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.n{font-variant-numeric:tabular-nums}
.r{text-align:right}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)} .faint{color:var(--faint)}
.xs{font-size:12px} .sm{font-size:13px}
.b{font-weight:600}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
#sidebar{
  width:256px;flex:0 0 256px;background:var(--ink);min-height:100vh;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px;padding:18px 16px 16px}
.brand .mark{width:44px;height:44px;border-radius:12px;background:var(--amber);display:grid;place-items:center;flex:0 0 44px}
.brand .mark svg{stroke:var(--ink)}
.brand h1{color:#fff;font-size:16px;font-weight:700;line-height:1.15}
.brand span{display:block;color:#9c968b;font-size:11.5px;line-height:1.3;margin-top:1px}
.rule{height:1px;background:#2b2f37;margin:0 16px}
.nav{padding:12px 12px 24px;display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 12px;border:0;border-radius:9px;background:transparent;color:#c9c4bb;
  font-size:13.5px;cursor:pointer;transition:background .12s,color .12s;
}
.nav button svg{stroke:currentColor;flex:0 0 18px}
.nav button:hover{background:var(--ink-2);color:#fff}
.nav button.on{background:var(--amber);color:var(--ink);font-weight:600}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.topbar-in{display:flex;align-items:center;gap:12px;padding:12px 24px}
.topbar-in h2{font-size:18px}
.topbar-in .sub{font-size:12px;color:var(--muted)}
.clock{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.clock b{display:block;color:var(--text);font-weight:600;font-size:13px}
.burger{display:none;background:none;border:0;padding:6px;margin-left:-6px;border-radius:8px;cursor:pointer}
.burger:hover{background:var(--line-2)}
main{padding:24px;max-width:1440px;width:100%}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card > header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card > header h3{font-size:14px}
.card > header .note{font-size:12px;color:var(--muted);margin-top:2px}
.card .body{padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;gap:16px;grid-template-columns:2fr 1fr}
.half{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat .lbl svg{stroke:var(--faint)}
.stat .val{font-size:24px;font-weight:600;letter-spacing:-0.02em;margin-top:6px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}

.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;border:1px solid;white-space:nowrap}
.b-gray{background:#f4f2ee;color:#5f5b54;border-color:#e4e0d8}
.b-amber{background:#fff5da;color:#8a5c00;border-color:#f6e3ae}
.b-green{background:#e9f6ef;color:#0f6b42;border-color:#c8e8d7}
.b-red{background:#fdecea;color:#a3231c;border-color:#f6cfcb}
.b-blue{background:#eaf1f8;color:#1f4e79;border-color:#cfe0ef}

.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid transparent;
  padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
.btn svg{stroke:currentColor}
.btn-primary{background:var(--amber);color:var(--ink)}
.btn-primary:hover{background:var(--amber-2)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-3)}
.btn-ghost{background:var(--surface);border-color:#d6d2ca;color:var(--text)}
.btn-ghost:hover{background:#f7f5f1}
.btn-sm{padding:6px 10px;font-size:12px}
.link{background:none;border:0;padding:0;color:var(--amber-ink);font-size:12px;font-weight:600;cursor:pointer}
.link:hover{color:#6a4600;text-decoration:underline}
.link-mut{color:var(--muted)} .link-mut:hover{color:var(--text)}

.tw{overflow-x:auto}
thead th{
  background:#faf9f6;border-bottom:1px solid var(--line);padding:9px 12px;
  font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;white-space:nowrap
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{background:#faf9f6;font-weight:600;border-top:1px solid var(--line)}
.dense td{padding:7px 12px}
.sub-line{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}

.meter{height:7px;background:#eeece6;border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:99px}
.meter i.low{background:var(--neg)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button:hover{background:#f7f5f1}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* hero */
.hero{background:var(--ink);border-radius:var(--r);overflow:hidden}
.hero .in{padding:22px 24px 24px}
.hero .eyebrow{color:#9c968b;font-size:12px}
.hero .big{color:#fff;font-size:44px;font-weight:600;letter-spacing:-0.03em;line-height:1.05;margin-top:4px}
.hero .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#2b2f37;border-radius:8px;overflow:hidden;margin-top:20px}
.hero .strip div{background:var(--ink);padding:11px 13px}
.hero .strip .k{color:#9c968b;font-size:11.5px}
.hero .strip .v{color:var(--amber);font-size:14px;font-weight:600;margin-top:3px}
.hero .tape{height:5px;background:var(--amber)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:2px 0}
.alert svg{flex:0 0 16px;margin-top:2px}
.alert .t{font-size:13px}
.alert .d{font-size:12px;color:var(--muted)}

/* forms */
label.f{display:block}
label.f > span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.inp{width:100%;border:1px solid #d6d2ca;border-radius:8px;padding:8px 10px;font-size:13.5px;background:#fff}
.inp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,196,46,.28)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}

/* modal */
#modal-root:empty{display:none}
.overlay{position:fixed;inset:0;background:rgba(22,24,29,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal.wide{max-width:760px}
.modal > header{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;gap:16px;
  padding:14px 16px;border-bottom:1px solid var(--line)}
.modal > header h3{font-size:15px}
.modal > header .note{font-size:12px;color:var(--muted);margin-top:2px}
.x{background:none;border:0;padding:5px;border-radius:7px;cursor:pointer;line-height:0}
.x:hover{background:var(--line-2)}
.modal .body{padding:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.err{color:var(--neg);font-size:12px;text-align:right;margin-top:8px}

/* journal line editor */
.jline{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,1.6fr) minmax(0,1.6fr) minmax(0,1.6fr) 34px;gap:8px;align-items:center}
.jline + .jline{margin-top:8px}
.je-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
  border-top:1px solid var(--line);margin-top:14px;padding-top:12px}

/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{stroke:var(--amber)}

.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px}
.statement{max-width:560px}
.srow{display:flex;justify-content:space-between;padding:5px 0;color:#3a3d44}
.srow.ind{padding-left:16px}
.srow.tot{font-weight:600;color:var(--text);border-top:1px solid #d6d2ca;margin-top:4px;padding-top:8px}
.shead{font-size:12px;color:var(--muted);margin:14px 0 2px}
.shead:first-child{margin-top:0}

/* charts */
.chart{width:100%;display:block}
.chart .grid-line{stroke:#e8e5df}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px;padding-left:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

@media (max-width:1100px){
  .split{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);transition:transform .2s}
  #sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .burger{display:block}
  .scrim{position:fixed;inset:0;background:rgba(22,24,29,.5);z-index:65}
  main{padding:16px}
  .topbar-in{padding:10px 16px}
  .half,.g3,.g2{grid-template-columns:1fr}
  .hero .big{font-size:34px}
  .hero .strip{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .span2{grid-column:span 1}
  .jline{grid-template-columns:1fr 1fr;}
  .clock{display:none}
}

/* ---------- AI ---------- */
.aibadge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--pos);background:#e9f6ef;border:1px solid #c8e8d7;padding:3px 9px;border-radius:99px;white-space:nowrap}
.aibadge.off{color:var(--amber-ink);background:#fff5da;border-color:#f6e3ae}
.aibadge.wait{color:var(--muted);background:#f4f2ee;border-color:#e4e0d8}
.aibadge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.ai-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line-2)}
.ai-bar select{border:1px solid #d6d2ca;border-radius:8px;padding:7px 10px;font-size:13px;background:#fff}
.ai-bar select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,196,46,.28)}
.ai-out{white-space:pre-wrap;font-size:13.5px;line-height:1.75;color:#2c2f36;min-height:132px}
.ai-out .ph{color:var(--muted)}
.ai-cur{display:inline-block;width:7px;height:14px;background:var(--amber);vertical-align:-2px;margin-left:2px;animation:aiblink 1s steps(2) infinite}
@keyframes aiblink{50%{opacity:0}}
.ai-grid{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.ai-flag{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--surface)}
.ai-flag .h{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.ai-flag .h svg{stroke:var(--faint)}
.ai-flag .v{font-size:19px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.ai-flag .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55}
.ai-flag.good{border-color:#cbe8d8;background:#f8fdfa}
.ai-flag.good .v{color:var(--pos)}
.ai-flag.warn{border-color:#f0d9a8;background:#fffdf4}
.ai-flag.warn .v{color:var(--amber-ink)}
.ai-flag.bad{border-color:#f2cdc9;background:#fffaf9}
.ai-flag.bad .v{color:var(--neg)}

/* floating assistant */
#aiFab{position:fixed;right:22px;bottom:22px;z-index:75;min-width:54px;height:54px;padding:0 20px 0 16px;border-radius:999px;border:0;cursor:pointer;
  background:var(--ink);color:var(--amber);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 26px rgba(22,24,29,.32);transition:transform .18s}
#aiFab:hover{transform:translateY(-2px)}
#aiFab .i2{display:none}
#aiFab.open .i1{display:none}
#aiFab.open .i2{display:block}
#aiFab svg{flex:none}
#aiFab .fab-label{font:inherit;font-size:14px;font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1}
#aiFab.open{padding:0}
#aiFab.open .fab-label{display:none}
#aiPanel{position:fixed;right:22px;bottom:86px;z-index:76;width:374px;max-width:calc(100vw - 28px);height:516px;max-height:calc(100vh - 132px);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(22,24,29,.3);
  display:none;flex-direction:column;overflow:hidden}
#aiPanel.open{display:flex;animation:aiup .2s ease-out}
@keyframes aiup{from{opacity:0;transform:translateY(12px)}}
.ai-hd{background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex:none}
.ai-hd .mk{width:30px;height:30px;border-radius:8px;background:var(--amber);color:var(--ink);display:grid;place-items:center;flex:none}
.ai-hd h4{font-size:13.5px}
.ai-hd small{display:block;font-size:11px;color:#9c968b;margin-top:1px}
.ai-hd button{margin-left:auto;background:rgba(255,255,255,.1);border:0;color:#ded9d0;width:26px;height:26px;
  border-radius:7px;cursor:pointer;line-height:0;display:grid;place-items:center}
.ai-hd button:hover{background:rgba(255,255,255,.2);color:#fff}
#aiLog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--canvas)}
.aimsg{max-width:88%;font-size:13px;line-height:1.62;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.aimsg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.aimsg.user{background:var(--ink);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.aimsg.err{background:#fdecea;border:1px solid #f6cfcb;color:#a3231c;align-self:flex-start;font-size:12.5px}
.aimsg .who{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.55;margin-bottom:3px}
.aityping{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;border-bottom-left-radius:4px;
  padding:11px 13px;display:flex;gap:4px}
.aityping i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:aidot 1.1s infinite}
.aityping i:nth-child(2){animation-delay:.15s}
.aityping i:nth-child(3){animation-delay:.3s}
@keyframes aidot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.aichips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;flex:none;background:var(--canvas)}
.aichips button{font-size:11.5px;background:#fff5da;border:1px solid #f6e3ae;color:var(--amber-ink);padding:5px 9px;border-radius:99px;cursor:pointer}
.aichips button:hover{background:#ffeec2}
.ai-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);flex:none}
.ai-in input{flex:1;border:1px solid #d6d2ca;border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none;background:#fff}
.ai-in input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,196,46,.28)}
.ai-in button{background:var(--amber);border:0;border-radius:8px;padding:0 15px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.ai-in button:hover{background:var(--amber-2)}
.ai-in button:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:1100px){.ai-grid{grid-template-columns:1fr}}
@media (max-width:560px){
  #aiPanel{left:10px;right:10px;width:auto;bottom:80px;top:70px;height:auto;max-height:none}
  #aiFab{right:14px;bottom:14px}
  .ai-bar select,.ai-bar .btn{flex:1}
}


/* =====================================================================
   v2 additions — journal-driven build
   ===================================================================== */
:root{ --display:"Barlow Semi Condensed","Inter",-apple-system,"Segoe UI",Roboto,sans-serif; }
h2,h3,.brand h1,.stat .val,.hero .big,.kpi .v,.ai-flag .v,.pj-title{font-family:var(--display);letter-spacing:0}
.topbar-in h2{font-size:21px;font-weight:600}
.card > header h3{font-size:16px;font-weight:600}
.stat .val{font-size:27px;font-weight:600}
.hero .big{font-weight:600;font-size:48px}
.hero .tape{height:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,var(--ink) 14px 28px)}
.brand h1{font-size:19px;font-weight:700}

/* sidebar groups */
.nav .grp{font-size:11px;color:#77736b;padding:14px 12px 4px;font-weight:500}
.nav .grp:first-child{padding-top:4px}
.nav button.key{color:#fff}
.nav button.key:not(.on) svg{stroke:var(--amber)}
.side-foot{padding:0 16px 20px;color:#77736b;font-size:11.5px;line-height:1.5}
.side-foot b{color:#c9c4bb;font-weight:500}

/* toolbar rows */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar .grow{flex:1;min-width:180px}
.bar .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{border:1px solid #d6d2ca;border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff;max-width:100%}
.sel:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,196,46,.28)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--faint);pointer-events:none}
.search .inp{padding-left:32px}
tr.click{cursor:pointer}
tr.click:hover td{background:#fbfaf7}
tr.void td{color:var(--faint);text-decoration:line-through}
.rowlink{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:600;cursor:pointer;text-align:left}
.rowlink:hover{color:var(--amber-ink);text-decoration:underline}
.more-row{padding:12px;text-align:center;border-top:1px solid var(--line-2)}

.chk{display:flex;align-items:center;gap:7px;font-size:13px;padding-top:22px}

.jl-head,.jl{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1.9fr) minmax(0,1.2fr) minmax(0,1.15fr) minmax(0,1.15fr) 30px 30px;gap:6px;align-items:center}

kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#faf9f6;color:var(--muted)}

.pj-prog .meter i.alt{background:#7fb4e6}

.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:#b4aea3;font-size:12.5px;cursor:pointer}

<script>
/* ============================================================
   Build Legend — journal-driven construction accounting
   Single file, no dependencies.

   HOW IT WORKS
   The journal is the only book of original entry. Every line can
   carry a project, a work phase, a name (supplier, subcontractor,
   worker, client, employee, sister company or fund) and a document
   number. Every other screen — project cost sheets, supplier and
   worker ledgers, billings, payables aging, bank balances, check
   register, petty cash funds, employee loans, intercompany and
   the financial statements — is computed from those lines.
   ============================================================ */

/* ---------------- date engine ---------------- */
const NOW = new Date();
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseD = (s) => new Date(s + "T00:00:00");
const TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
const TODAY_S = iso(TODAY);
/* monthEnd(1) = last day of the previous month, monthEnd(0) = last day of this month */
const monthEnd = (k) => new Date(NOW.getFullYear(), NOW.getMonth() - k + 1, 0);
const monthDay = (k, d) => new Date(NOW.getFullYear(), NOW.getMonth() - k, d);
const ME = (k, n) => iso(addDays(monthEnd(k), n || 0));
const plus = (s, n) => iso(addDays(parseD(s), n));
const daysPast = (s) => Math.round((TODAY - parseD(s)) / 864e5);
const fdate = (s) => (s ? parseD(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—");
const fshort = (s) => (s ? parseD(s).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—");
const ym = (s) => s.slice(0, 7);
const ymLabel = (k) => parseD(k + "-01").toLocaleDateString("en-US", { month: "short" });

/* ---------------- number formatting ---------------- */
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const n2 = (n) => Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n0 = (n) => Math.round(Number(n || 0)).toLocaleString("en-US");
const q1 = (n) => (Math.round(Number(n || 0) * 10) / 10).toLocaleString("en-US");
const peso = (n) => "₱" + n2(n);
const signed = (n) => (n < -0.004 ? "(" + n2(Math.abs(n)) + ")" : n2(Math.abs(n) < 0.005 ? 0 : n));
const compact = (n) => {
  const a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 1e6) return s + "₱" + (a / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return s + "₱" + Math.round(a / 1e3).toLocaleString("en-US") + "K";
  return s + "₱" + n2(a);
};
const pct = (a, b) => (b ? (a / b) * 100 : 0);
const pc1 = (x) => (isFinite(x) ? x.toFixed(1) : "0.0") + "%";
const num = (v) => { const x = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isFinite(x) ? x : 0; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = (p) => (p || "x") + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);

/* ---------------- icons ---------------- */
const P = {
  dashboard: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  bank: '<path d="M3 9.5 12 4l9 5.5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20.5h18"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>',
  clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 11h6M9 15h4"/>',
  book: '<path d="M4 4h5.5A2.5 2.5 0 0 1 12 6.5V20a2.5 2.5 0 0 0-2.5-2H4z"/><path d="M20 4h-5.5A2.5 2.5 0 0 0 12 6.5V20a2.5 2.5 0 0 1 2.5-2H20z"/>',
  doc: '<path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4"/><path d="M9 12h6M9 16h4"/>',
  receipt: '<path d="M5 2.5h14v19l-2.3-1.6-2.35 1.6L12 20l-2.35 1.5L7.3 20 5 21.5z"/><path d="M9 8h6M9 12h6"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  coins: '<circle cx="9" cy="9" r="5"/><path d="M14.6 5.3A5 5 0 1 1 9.4 18.7"/>',
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v0"/><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H3z"/><circle cx="17" cy="13" r="1.2"/>',
  buildings: '<rect x="3" y="8" width="8" height="13" rx="1"/><rect x="13" y="3" width="8" height="18" rx="1"/><path d="M6 12h2M6 16h2M16 7h2M16 11h2M16 15h2"/>',
  chart: '<path d="M3 20.5h18"/><path d="M6.5 20V12M12 20V4.5M17.5 20V14.5"/>',
  hardhat: '<path d="M3.5 17.5h17"/><path d="M5.5 17.5V15A6.5 6.5 0 0 1 12 8.5a6.5 6.5 0 0 1 6.5 6.5v2.5"/><path d="M9.5 9V5.5h5V9"/>',
  truck: '<path d="M2.5 6.5h11v10h-11z"/><path d="M13.5 10h4l3 3v3.5h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M17.5 14.4c2 .8 3.5 2.9 3.5 5.6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/>',
  plus: '<path d="M12 5.5v13M5.5 12h13"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-4.9"/>',
  alert: '<path d="M12 3.5 21 19H3z"/><path d="M12 10v4.5M12 17.2h.01"/>',
  trash: '<path d="M4 7h16M9.5 7V4h5v3M6.5 7l1 13.5h9L17.5 7"/>',
  up: '<path d="M7 17 17 7M9 7h8v8"/>',
  down: '<path d="M7 7l10 10M17 9v8H9"/>',
  back: '<path d="M14.5 6 8.5 12l6 6"/>',
  dots: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  print: '<path d="M7 8V3.5h10V8"/><rect x="3.5" y="8" width="17" height="9" rx="2"/><path d="M7 14h10v6.5H7z"/>',
  download: '<path d="M12 4v11M7.5 11 12 15.5 16.5 11"/><path d="M4.5 19.5h15"/>',
  spark: '<path d="M12 3.2l1.9 4.9 4.9 1.9-4.9 1.9L12 16.8l-1.9-4.9L5.2 10l4.9-1.9z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  bot: '<rect x="4" y="7.5" width="16" height="12" rx="3"/><path d="M12 3.5v4"/><circle cx="9" cy="13" r="1.1"/><circle cx="15" cy="13" r="1.1"/><path d="M9.5 16.5h5"/>',
};
const icon = (name, size) =>
  '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + P[name] + "</svg>";

/* ---------------- chart of accounts ----------------
   role tells the engine which sub-ledger an account feeds:
   bank / cash  → bank balances, check register
   fund         → petty cash and revolving funds (name = the fund)
   ar / retrec  → billings and retention receivable (name = client)
   ap / retpay  → payables and retention payable (name = supplier)
   advances     → employee loans (name = employee or worker)
   duefrom / dueto → sister companies                                */
const A = (code, name, group, sub, normal, role) => ({ code: code, name: name, group: group, sub: sub, normal: normal, role: role || "" });
const DEFAULT_ACCOUNTS = [

function derive() {
  const A = {}; DB.accounts.forEach((a) => (A[a.code] = a));

  const PB = (role, id) => { pb[role] = pb[role] || {}; return pb[role][id] || (pb[role][id] = { id: id, dr: 0, cr: 0, last: "", first: "", note: "", lines: [] }); };

  entries.forEach((j) => j.lines.forEach((l) => {

    if (!a) return;
    if (a.role && !isCashRole(a.role)) { const x = PB(a.role, l.party || "?"); x.dr += l.dr; x.cr += l.cr; x.last = j.date; if (!x.first) x.first = j.date; if (!x.note && l.note) x.note = l.note; x.lines.push({ j: j, l: l }); }
    if (a.role === "ar" || a.role === "ap") {
      const amt = (a.role === "ar" ? 1 : -1) * (l.dr - l.cr);
      if (amt > 0) {
        const no = l.doc || j.ref || j.no, key = (l.party || "?") + "|" + no, m = docs[a.role];

        if (!d) { d = { key: key, role: a.role, party: l.party, doc: no, date: j.date, due: l.due || plus(j.date, termsOf(l.party)), project: l.project, amount: 0, paid: 0, memo: j.memo, note: l.note, jid: j.id, pays: [] }; m.set(key, d); }

    if (amt > 0) Array.from(m.values()).filter((d) => d.party === l.party && d.amount - d.paid > 0.004).sort((x, y) => (x.date < y.date ? -1 : 1)).forEach((d) => { if (amt > 0) apply(d); });
    if (amt > 0) unapplied[a.role][l.party || "?"] = r2((unapplied[a.role][l.party || "?"] || 0) + amt);
  }));

  /* pass 3 — projects, months, cash allocation */
  entries.forEach((j) => {
    let cashNet = 0, pos = 0, neg = 0;
    j.lines.forEach((l) => { const a = A[l.code]; if (!a) return; if (isCashRole(a.role) || a.role === "fund") cashNet += l.dr - l.cr; else { const v = l.cr - l.dr; if (v > 0) pos += v; else neg -= v; } });

    const mk = ym(j.date), mm = M(mk); mm.cash += bankNet + j.lines.reduce((s, l) => s + (A[l.code] && A[l.code].role === "fund" ? l.dr - l.cr : 0), 0);

      const a = A[l.code]; if (!a) return;

        const v = l.cr - l.dr;

        if (cashNet < 0 && v < 0 && neg) { const x = (-v * -cashNet) / neg; p.cashOut += x; pm.cashOut += x; }

  S.modal.fields.forEach((f) => { const el = document.getElementById("f_" + f.k); out[f.k] = !el ? "" : f.type === "check" ? el.checked : el.value.trim(); if (f.required && !out[f.k]) missing.push(f.label.toLowerCase()); });

function download(name, text, type) { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type || "text/plain" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) { toast("This browser blocked the download"); } }

/* open the editor from anywhere, optionally with a quick fill already chosen */
function startJE(tpl, values) {
  S.je = newJE({ date: TODAY_S });
  if (tpl && TPL[tpl]) { S.je.tpl = tpl; S.je.tv = Object.assign(TPL[tpl].init(), values || {}); if (TPL[tpl].onChange) Object.keys(values || {}).forEach((k) => { TPL[tpl].onChange(S.je.tv, k); Object.assign(S.je.tv, values); }); }
  S.nav = "journal"; S.lastPost = null; S.sidebarOpen = false; closeModal(); render(); window.scrollTo(0, 0);
  const el = document.querySelector("#tplBox .inp, #je_memo"); if (el) el.focus();
}

function jeTotals() { const dr = S.je.lines.reduce((s, l) => s + num(l.dr), 0), cr = S.je.lines.reduce((s, l) => s + num(l.cr), 0); return { dr: r2(dr), cr: r2(cr), ok: dr > 0 && Math.abs(dr - cr) < 0.005 }; }
function jeCheck() {
  const errs = [], warns = [], t = jeTotals(), used = S.je.lines.filter((l) => l.code || num(l.dr) || num(l.cr));
  if (used.length < 2) errs.push("An entry needs at least one debit line and one credit line.");
  used.forEach((l, i) => {
    const a = acct(l.code), n = "Line " + (S.je.lines.indexOf(l) + 1);
    if (!a) { errs.push(n + " has an amount but no account."); return; }
    if (num(l.dr) && num(l.cr)) errs.push(n + " has both a debit and a credit. Use one side per line.");
    if (!num(l.dr) && !num(l.cr)) errs.push(n + " (" + a.name + ") has no amount.");
    if (a.role && !isCashRole(a.role) && !l.party.trim()) errs.push(n + ": " + a.name + " needs a name, so the " + (ROLE_PARTY[a.role] || "sub-ledger").toLowerCase() + " ledger knows whose balance this is.");
    if (a.group === "Direct cost" && !l.project && DB.projects.length) warns.push(n + ": " + a.name + " has no project, so it will not reach any project cost sheet.");
    else if (a.group === "Direct cost" && !l.cc) warns.push(n + ": no work phase chosen — it will show under Unassigned in the phase breakdown.");
  });
  if (used.length >= 2 && !t.ok) errs.push(t.dr || t.cr ? "Debits and credits differ by " + n2(Math.abs(t.dr - t.cr)) + "." : "Enter the amounts.");
  if (!S.je.memo.trim()) errs.push("Add the particulars — a short description of the transaction.");
  if (!S.je.date) errs.push("Pick a date.");
  return { errs: errs, warns: warns };
}
function jeTotalsHtml() { const t = jeTotals(); return '<span><span class="mut">Debit</span> <b>' + n2(t.dr) + '</b></span><span><span class="mut">Credit</span> <b>' + n2(t.cr) + '</b></span><span class="' + (t.ok ? "pos" : "neg") + ' b">' + (t.ok ? "In balance" : "Out by " + n2(Math.abs(t.dr - t.cr))) + "</span>"; }
function jeHintsHtml(showErrs) { const c = jeCheck(); return (showErrs ? c.errs.map((e) => '<p class="hint bad">' + icon("alert", 14) + "<span>" + esc(e) + "</span></p>") : []).concat(c.warns.slice(0, 3).map((w) => '<p class="hint">' + icon("alert", 14) + "<span>" + esc(w) + "</span></p>")).join(""); }
function docListHtml(l) { const r = roleOf(l.code); return r === "ar" || r === "ap" ? openDocsOf(r, l.party).map((d) => '<option value="' + esc(d.doc) + '">' + esc("balance " + n2(d.balance) + " · due " + fshort(d.due)) + "</option>").join("") : ""; }

  const head = '<div class="je-head">' +
    '<label class="f"><span>Date</span><input class="inp" type="date" id="je_date" value="' + esc(je.date) + '"></label>' +
    '<label class="f"><span>Reference no.</span><input class="inp" id="je_ref" value="' + esc(je.ref) + '" placeholder="Invoice, OR or voucher no."></label>' +

function resolveParty(name, code) {
  const n = String(name || "").trim(); if (!n) return "";

  const p = { id: uid("N"), name: n, type: type, terms: 30 }; DB.parties.push(p); return p.id;
}

}

function jeImpactHtml() {
  if (!S.je) return "";
  const d = D(), items = [], add = (ic, title, text, tone) => items.push('<li class="imp ' + (tone || "") + '">' + icon(ic, 15) + "<div><b>" + title + "</b><span>" + text + "</span></div></li>");
  const used = S.je.lines.filter((l) => l.code && (num(l.dr) || num(l.cr)));
  if (!used.length) return "";
  const grp = {}, key = (k, o) => grp[k] || (grp[k] = Object.assign({ v: 0 }, o));
  let pl = 0;
  used.forEach((l) => {
    const a = acct(l.code); if (!a) return; const v = num(l.dr) - num(l.cr), nm = l.party.trim();
    if (a.group === "Revenue") pl -= v; if (a.group === "Direct cost" || a.group === "Expense") pl -= v;
    if (isCashRole(a.role)) key("bank" + a.code, { t: "bank", a: a }).v += v;
    else if (a.role === "fund") key("fund" + nm, { t: "fund", nm: nm }).v += v;
    else if (a.role === "ap") key("ap" + nm + l.doc, { t: "ap", nm: nm, doc: l.doc, due: l.due }).v -= v;
    else if (a.role === "ar") key("ar" + nm + l.doc, { t: "ar", nm: nm, doc: l.doc, due: l.due }).v += v;
    else if (a.role === "retrec" || a.role === "retpay") key("ret" + a.role + nm, { t: a.role, nm: nm }).v += a.role === "retrec" ? v : -v;
    else if (a.role === "advances") key("ln" + nm, { t: "loan", nm: nm }).v += v;
    else if (a.role === "duefrom" || a.role === "dueto") key("ic" + a.role + nm, { t: a.role, nm: nm }).v += a.role === "duefrom" ? v : -v;
    if (a.group === "Direct cost" && l.project) { const g = key("pj" + l.project + l.code, { t: "cost", pid: l.project, a: a, names: {}, days: 0 }); g.v += v; if (nm) g.names[nm] = 1; g.days += /day/i.test(l.unit) ? num(l.qty) : 0; }
    if (a.group === "Revenue" && l.project) key("rv" + l.project, { t: "rev", pid: l.project }).v -= v;
  });
  Object.keys(grp).forEach((k) => {
    const g = grp[k], nm = esc(g.nm || "no name yet"); if (Math.abs(g.v) < 0.005) return;
    if (g.t === "bank") { const nb = (d.bal[g.a.code] || 0) + g.v; add("bank", esc(g.a.name), (g.v > 0 ? "goes up by " : "goes down by ") + peso(Math.abs(g.v)) + " to " + peso(nb), nb < 0 ? "bad" : ""); }
    if (g.t === "fund") add("clipboard", "Petty cash — " + nm, (g.v > 0 ? "replenished by " : "spends ") + peso(Math.abs(g.v)));
    if (g.t === "ap") add("wallet", "Payables — " + nm, g.v > 0 ? "new bill " + esc(g.doc || "(number follows the entry)") + " for " + peso(g.v) + (g.due ? ", due " + fshort(g.due) : "") : peso(-g.v) + " paid off " + (g.doc ? "bill " + esc(g.doc) : "their oldest open bills"));
    if (g.t === "ar") add("receipt", "Billings — " + nm, g.v > 0 ? "new invoice " + esc(g.doc || "") + " for " + peso(g.v) + (g.due ? ", due " + fshort(g.due) : "") : peso(-g.v) + " collected against " + (g.doc ? esc(g.doc) : "their oldest open invoices"));
    if (g.t === "retrec") add("receipt", "Retention held by " + nm, (g.v > 0 ? "up " : "released ") + peso(Math.abs(g.v)));
    if (g.t === "retpay") add("wallet", "Retention we hold from " + nm, (g.v > 0 ? "up " : "released ") + peso(Math.abs(g.v)));
    if (g.t === "loan") add("coins", "Employee loans — " + nm, g.v > 0 ? peso(g.v) + " released" : peso(-g.v) + " deducted or repaid");
    if (g.t === "duefrom") add("buildings", "Due from " + nm, (g.v > 0 ? "up " : "down ") + peso(Math.abs(g.v)));
    if (g.t === "dueto") add("buildings", "Due to " + nm, (g.v > 0 ? "up " : "down ") + peso(Math.abs(g.v)));
    if (g.t === "cost") { const p = project(g.pid), x = d.P[g.pid], bud = num((p.budget || {})[g.a.code]), after = (x.byAcct[g.a.code] || 0) + g.v, names = Object.keys(g.names);
      add("folder", esc(projShort(g.pid)) + " — " + esc(g.a.name), "+" + peso(g.v) + (g.days ? " for " + g.days + " man-days" : "") + (names.length ? " (" + esc(names.slice(0, 2).join(", ")) + (names.length > 2 ? " and " + (names.length - 2) + " more" : "") + ")" : "") + (bud ? ". Budget used goes to " + pc1(pct(after, bud)) : ""), bud && after > bud ? "bad" : ""); }
    if (g.t === "rev") add("up", esc(projShort(g.pid)) + " — billed to date", "+" + peso(g.v) + ", reaching " + pc1(pct(d.P[g.pid].rev + g.v, project(g.pid).contract)) + " of the contract");
  });
  if (Math.abs(pl) > 0.004) add("chart", "Income statement", "net income " + (pl > 0 ? "rises by " : "falls by ") + peso(Math.abs(pl)));
  return items.length ? '<p class="imp-h">When you post, these update on their own</p><ul class="imps">' + items.join("") + "</ul>" : "";
}

  };
}

/* ---- streaming call (NDJSON) ---- */
async function aiChat(messages, opts) {
  opts = opts || {};
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), AI.timeout);
  try {
    const res = await fetch(AI.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal, body: JSON.stringify({ model: AI.model, messages: messages, stream: true }) });
    if (!res.ok) { let t = ""; try { t = (await res.text()).slice(0, 140); } catch (_) {} throw new Error("HTTP " + res.status + (t ? " · " + t : "")); }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", full = "";
    while (true) {
      const r = await reader.read(); if (r.done) break;
      buf += dec.decode(r.value, { stream: true }); const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) { const t = line.trim(); if (!t) continue; let j = null; try { j = JSON.parse(t); } catch (_) { continue; } if (j.error) throw new Error(typeof j.error === "string" ? j.error : "API error"); const dlt = j.message && j.message.content; if (dlt) { full += dlt; if (opts.onDelta) opts.onDelta(dlt, full); } }
    }
    if (!full.trim()) throw new Error("empty response from the model");
    return full;
  } finally { clearTimeout(timer); }
}

    "Reply in the language the user writes in — if they write Tagalog or Taglish, answer the same way.\n" +
    "Never mention that you are an AI model, and never reveal the model, provider or technology behind you. If asked, say only: \"I'm the assistant built into your accounting system.\"\n\n=== LIVE LEDGER SNAPSHOT ===\n" + aiSnapshot();
  function msg(kind, text) { const el = document.createElement("div"); el.className = "aimsg " + kind; const w = document.createElement("span"); w.className = "who"; w.textContent = kind === "user" ? "You" : kind === "err" ? "System" : "Assistant"; el.appendChild(w); el.appendChild(document.createTextNode(text || "")); log.appendChild(el); log.scrollTop = log.scrollHeight; return el; }
  function typingBubble() { const el = document.createElement("div"); el.className = "aityping"; el.innerHTML = "<i></i><i></i><i></i>"; log.appendChild(el); log.scrollTop = log.scrollHeight; return el; }
  function chips() { chipBox.innerHTML = SUGGEST.map((q) => "<button>" + esc(q) + "</button>").join(""); Array.prototype.forEach.call(chipBox.querySelectorAll("button"), (b) => { b.onclick = () => { input.value = b.textContent; send(); }; }); }
  async function send() {
    const text = (input.value || "").trim(); if (!text || busy) return;
    busy = true; sendB.disabled = true; input.value = ""; chipBox.innerHTML = ""; msg("user", text); history.push({ role: "user", content: text });
    const tip = typingBubble();
    try {
      const bubble = { el: null, node: null };
      const full = await aiChat([{ role: "system", content: sysPrompt() }].concat(history), { onDelta: (_, all) => { if (!bubble.el) { tip.remove(); bubble.el = msg("bot", ""); bubble.node = bubble.el.lastChild; } bubble.node.textContent = all; log.scrollTop = log.scrollHeight; } });
      if (!bubble.el) { tip.remove(); msg("bot", full); }
      history.push({ role: "assistant", content: full }); if (history.length > 16) history = history.slice(-16); aiStatus(true);
    } catch (err) { tip.remove(); msg("err", "Couldn’t reach the assistant (" + err.message + "). The AI analysis tab under Reports still runs its built-in review offline."); history.pop(); aiStatus(false); }
    busy = false; sendB.disabled = false; input.focus();
  }
  function open() { panel.classList.add("open"); fab.classList.add("open"); if (!opened) { opened = true; msg("bot", "I'm the assistant built into your accounting system. I can see the trial balance, bank positions, billings and aging, payables, suppliers, site labor, petty cash and every project cost sheet. Ask me anything about the books."); chips(); } setTimeout(() => input.focus(), 120); }
  function close() { panel.classList.remove("open"); fab.classList.remove("open"); }
  fab.onclick = () => (panel.classList.contains("open") ? close() : open());
  document.getElementById("aiClose").onclick = close; sendB.onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.stopPropagation(); send(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && panel.classList.contains("open")) close(); });
}

/* ============================================================
   SHELL — navigation, render, events
   ============================================================ */
const NAV = [
  { g: "Daily work", items: [["dashboard", "Dashboard", "dashboard"], ["journal", "Journal Entry", "book", 1]] },
  { g: "Jobs", items: [["projects", "Projects", "folder"], ["suppliers", "Suppliers and Subcons", "truck"], ["workers", "Workers", "users"]] },
  { g: "Money", items: [["invoices", "Billings and Collections", "receipt"], ["payables", "Payables", "wallet"], ["banks", "Bank Balances", "bank"], ["cash", "Cash and Check", "cash"], ["replenish", "Petty Cash Funds", "clipboard"], ["loans", "Employee Loans", "coins"], ["sisters", "Sister Companies", "buildings"]] },
  { g: "Books", items: [["coa", "Chart of Accounts", "doc"], ["reports", "Reports", "chart"], ["settings", "Company and Data", "gear"]] },
];
const navItem = (id) => { let hit = null; NAV.forEach((g) => g.items.forEach((n) => { if (n[0] === id) hit = n; })); return hit || NAV[0].items[0]; };

function renderSidebar() {
  const sb = document.getElementById("sidebar"); sb.className = S.sidebarOpen ? "open" : "";
  const d = D(), due = d.apDocs.filter((x) => x.balance > 0.004 && x.days > 0).length, late = d.arDocs.filter((x) => x.balance > 0.004 && x.days > 0).length, low = fundsFull().filter((f) => f.ceiling && f.onHand < f.ceiling * 0.25).length;
  const count = { payables: due, invoices: late, replenish: low };
  sb.innerHTML = '<div class="brand"><div class="mark">' + icon("hardhat", 24) + "</div><div><h1>" + esc(company()) + "</h1><span>Construction Accounting</span></div></div>" +
    '<div class="rule"></div><nav class="nav">' + NAV.map((g) => '<p class="grp">' + g.g + "</p>" + g.items.map((n) => '<button class="' + (S.nav === n[0] ? "on" : "") + (n[3] ? " key" : "") + '" data-act="nav" data-id="' + n[0] + '">' + icon(n[2]) + "<span>" + n[1] + "</span>" + (count[n[0]] ? '<em class="cnt">' + count[n[0]] + "</em>" : "") + "</button>").join("")).join("") + "</nav>" +
    '<div class="side-foot">' + (S.saved === false ? "<b>Not saved.</b> This browser is blocking storage — export a backup." : DB.demo && S.saved === null ? "<b>Sample books.</b> Saved to this device from your first change." : "<b>Saved on this device.</b> Export a backup under Company and Data.") + "</div>";
  const old = document.querySelector(".scrim"); if (old) old.remove();
  if (S.sidebarOpen) { const sc = document.createElement("div"); sc.className = "scrim"; sc.setAttribute("data-act", "scrim"); document.body.appendChild(sc); }
}
function renderTopbar() {
  const b = D().bal, dr = DB.accounts.reduce((s, a) => s + Math.max(b[a.code] || 0, 0), 0), cr = DB.accounts.reduce((s, a) => s + Math.max(-(b[a.code] || 0), 0), 0), ok = Math.abs(dr - cr) < 0.005;
  const p = S.nav === "projects" && S.projectId ? project(S.projectId) : null;
  document.getElementById("topbar").innerHTML = '<div class="topbar-in"><button class="burger" data-act="burger" aria-label="Open menu">' + icon("menu", 20) + "</button>" +
    "<div><h2>" + (p ? esc(projShort(p.id)) : navItem(S.nav)[1]) + '</h2><p class="sub">' + esc(company()) + " · " + (DB.journal.length ? n0(DB.journal.length) + " journal entries" : "no entries yet") + "</p></div>" +
    (S.nav !== "journal" ? '<button class="btn btn-primary btn-sm top-new" data-act="newEntry">' + icon("plus", 15) + "<span>New entry</span></button>" : "") +
    '<div class="clock"><b id="clockNow"></b><span style="color:' + (ok ? "var(--pos)" : "var(--neg)") + '">' + (ok ? "Books in balance" : "Out of balance") + "</span></div></div>";
  tickClock();
}
function tickClock() { const el = document.getElementById("clockNow"); if (!el) return; const d = new Date(); el.textContent = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" }) + ", " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }

let _rendering = false;
function render() {
  if (_rendering) return; _rendering = true;
  try { renderNow(); } finally { _rendering = false; }
}
function renderNow() {
  if (!PAGES[S.nav]) S.nav = "dashboard";
  renderSidebar(); renderTopbar();
  document.getElementById("dl-root").innerHTML = S.nav === "journal" ? '<datalist id="dl-party">' + DB.parties.map((p) => '<option value="' + esc(p.name) + '">' + esc(p.type + (p.role ? " · " + p.role : "")) + "</option>").join("") + "</datalist>" : "";
  document.getElementById("main").innerHTML = PAGES[S.nav]();
  if (S.focus) { const el = /^[\[#.]/.test(S.focus) ? document.querySelector(S.focus) : document.getElementById(S.focus); if (el) { el.focus(); if (el.tagName === "INPUT" && el.type !== "date" && el.type !== "checkbox") { const v = el.value; el.value = ""; el.value = v; } } S.focus = null; }
}

/* ---------------- events ---------------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.getAttribute("data-act"); if (!ACT[a]) return;
  if (a === "scrimClose" && e.target !== el) return;
  if (el.tagName === "TR" && e.target.closest("button,a,input,select,label")) return;
  ACT[a](el.getAttribute("data-id"), el, e);
});

document.addEventListener("input", (e) => {
  const t = e.target, bind = t.getAttribute("data-bind");
  if (bind) { S[bind] = t.value; if (bind === "jq") S.jShow = 40; S.focus = t.id; if (document.getElementById("jeLines")) readJE(); render(); return; }
  const k = t.getAttribute("data-je");
  if (k === "qty") { const w = t.closest(".jl-wrap"), l = S.je && w ? S.je.lines[Number(w.getAttribute("data-i"))] : null; if (l) { const nameEl = w.querySelector('[data-je="party"]'), p = partyByName(nameEl ? nameEl.value : ""), codeEl = w.querySelector('[data-je="code"]'), a = acct(codeEl ? codeEl.value : ""); if (p && p.type === "Worker" && num(p.rate) > 0 && a && a.group === "Direct cost") { const drEl = w.querySelector('[data-je="dr"]'); if (drEl) drEl.value = amt(num(p.rate) * num(t.value)); } } }
  if (k || t.hasAttribute("data-tv") || /^je_/.test(t.id || "")) jeLive();
});

document.addEventListener("change", (e) => {
  if (_rendering) return;
  const t = e.target;
  const aiOpt = t.getAttribute("data-ai-opt"); if (aiOpt) { S.ai[aiOpt] = t.value; return; }
  const set = t.getAttribute("data-set"); if (set) { if (document.getElementById("jeLines")) readJE(); S[set] = t.value; if (set === "jSource") S.jShow = 40; render(); return; }
  const per = t.getAttribute("data-period"); if (per) { S.period[per] = t.value; if (per === "preset" && t.value === "custom" && !S.period.from) { S.period.from = iso(new Date(TODAY.getFullYear(), 0, 1)); S.period.to = TODAY_S; } render(); return; }
  if (t.id === "importFile") { if (t.files && t.files[0]) importBooks(t.files[0]); return; }
  if (t.hasAttribute("data-ptype") && S.modal) { const cfg = S.modal, keep = {}; cfg.fields.forEach((f) => { const el = document.getElementById("f_" + f.k); if (el && el.value !== "") keep[f.k] = el.value; }); partyForm(cfg._party, t.value, keep); return; }
  if (!S.je || !document.getElementById("jeLines")) return;
  if (t.id === "je_tpl") { readJE(); S.je.tpl = t.value; S.je.tv = t.value && TPL[t.value] ? TPL[t.value].init() : {}; S.je.tip = ""; render(); const f = document.querySelector("#tplBox .inp"); if (f) f.focus(); return; }
  if (t.hasAttribute("data-rr")) { readJE(); const tp = TPL[S.je.tpl], key = t.getAttribute("data-tv"); if (tp && tp.onChange) tp.onChange(S.je.tv, key); render(); const flds = Array.prototype.slice.call(document.querySelectorAll("#tplBox [data-tv]")), i = flds.findIndex((x) => x.getAttribute("data-tv") === key); if (flds[i + 1]) flds[i + 1].focus(); return; }
  if (t.hasAttribute("data-tv")) { readJE(); const tp = TPL[S.je.tpl]; if (tp && tp.onChange) { const before = JSON.stringify(S.je.tv); tp.onChange(S.je.tv, t.getAttribute("data-tv")); if (JSON.stringify(S.je.tv) !== before) { const key = t.getAttribute("data-tv"); render(); const el = document.querySelector('#tplBox [data-tv="' + key + '"]'); if (el) el.focus(); } } return; }
  const k = t.getAttribute("data-je");
  if (k) {
    readJE(); const w = t.closest(".jl-wrap"), i = Number(w.getAttribute("data-i")), l = S.je.lines[i];
    if (k === "code" || k === "party") { const dl = document.getElementById("dl-doc-" + i); if (dl) dl.innerHTML = docListHtml(l); }
    if (k === "party" && !l.project) { const p = partyByName(l.party), a = acct(l.code); if (p && p.type === "Worker" && a && a.group === "Direct cost") { let changed = false; if (p.project && project(p.project)) { l.project = p.project; changed = true; } if (p.trade && !l.cc) { l.cc = p.trade; changed = true; } if (!l.unit) { l.unit = "days"; l.more = true; changed = true; } if (changed) { S.focus = '[data-i="' + i + '"] [data-je="' + (l.more ? "qty" : "dr") + '"]'; render(); return; } } }
    if (k === "doc") { const r = roleOf(l.code), hit = (r === "ar" || r === "ap") && openDocsOf(r, l.party).find((x) => x.doc === l.doc.trim()); if (hit) { let changed = false; if (!l.project && hit.project) { l.project = hit.project; changed = true; } const side = r === "ap" ? "dr" : "cr"; if (!num(l.dr) && !num(l.cr)) { l[side] = amt(hit.balance); changed = true; } if (changed) { S.focus = '[data-i="' + i + '"] [data-je="' + side + '"]'; render(); return; } } }
    jeLive();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (document.getElementById("modal-root").innerHTML) closeModal(); return; }
  if (e.key === "Enter" && S.modal && e.target.tagName === "INPUT" && e.target.type !== "file") { e.preventDefault(); ACT.formSubmit(); return; }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && S.nav === "journal" && !S.modal) { e.preventDefault(); ACT.jePost(); return; }
  if (e.key === "Enter" && e.target.getAttribute && e.target.getAttribute("data-je") === "cr") { const w = e.target.closest(".jl-wrap"), all = document.querySelectorAll("#jeLines .jl-wrap"); if (w === all[all.length - 1]) { e.preventDefault(); ACT.jeAdd(); } }
  if (e.key === "Enter" && e.target.hasAttribute && e.target.hasAttribute("data-tv") && e.target.tagName === "INPUT") { e.preventDefault(); ACT.jeFill(); }
});

window.addEventListener("storage", (e) => { if (e.key === STORE_KEY && e.newValue && !document.getElementById("modal-root").innerHTML && !(S.je && S.je.lines.some((l) => l.code))) { const d = loadBooks(); if (d) { DB = d; _D = null; render(); } } });
setInterval(tickClock, 30000);
document.title = company() + " — Construction Accounting";
initAssistant();
render();

</script>
