<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NewPort Inc. — People operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16211D; --paper:#F4F5F3; --card:#FFFFFF; --line:#DDE0DA; --line-soft:#EAECE8;
  --moss:#3F6B52; --moss-soft:#E7EFE9; --amber:#B8873B; --amber-soft:#FAF1E0;
  --rose:#A0453E; --rose-soft:#F8EAE7; --muted:#6E7671; --muted-soft:#F0F1EE;
  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .18s ease-out}}
@keyframes rise{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.wrap{display:flex;min-height:100vh}
.rail{width:236px;flex:0 0 236px;background:var(--card);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column}
.main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar h1{font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.content{padding:28px;max-width:1120px}
.burger{display:none}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(22,33,29,.45)}
@media(max-width:800px){
  .rail{display:none}
  .rail.drawer-open{display:flex;position:fixed;left:0;top:0;z-index:50;width:280px;flex:none}
  .burger{display:block}
  .topbar{padding:14px 16px}
  .content{padding:20px 16px}
  .topbar .datestamp{display:none}
}

.brand{padding:20px 16px 16px}
.brand .name{font-family:var(--serif);font-size:21px;line-height:1}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px}
.rolebox{border:1px solid var(--line);border-radius:3px;overflow:hidden}
.roleopt{width:100%;text-align:left;padding:6px 10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;background:var(--card)}
.roleopt+.roleopt{border-top:1px solid var(--line-soft)}
.roleopt.on{background:var(--moss-soft);color:var(--moss);font-weight:600}
.nav{padding:0 8px 16px;flex:1;overflow-y:auto}
.navitem{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:14px;text-align:left;border-radius:3px}
.navitem svg{opacity:.6}
.navitem.on{background:var(--ink);color:var(--paper);font-weight:600}
.navitem.on svg{opacity:1}
.railfoot{padding:12px 16px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}

.card{background:var(--card);border:1px solid var(--line)}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.card>header h3{font-size:14px;font-weight:600}
.pad{padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
.stack>*+*{margin-top:16px}
.stat{padding:16px;background:var(--card);border:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:29px;line-height:1.05;margin-top:4px}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.av{display:flex;align-items:center;justify-content:center;flex:none;background:var(--ink);color:var(--paper);font-weight:600;border-radius:50%}
.tag{display:inline-flex;align-items:center;padding:2px 8px;font-size:12px;font-weight:500;border-radius:3px;white-space:nowrap;background:var(--muted-soft);color:var(--muted)}
.tag.good{background:var(--moss-soft);color:var(--moss)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--rose-soft);color:var(--rose)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:14px;font-weight:500;border-radius:3px;background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.moss{background:var(--moss);color:#fff;border-color:var(--moss)}
.btn.danger{background:transparent;color:var(--rose);border-color:var(--rose)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tablewrap{overflow-x:auto}
table{width:100%;min-width:580px;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;font-size:14px;vertical-align:middle;border-bottom:1px solid var(--line-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--paper)}
.sub{font-size:12px;color:var(--muted)}
.fw{font-weight:500}
.num{font-variant-numeric:tabular-nums}
.bar{width:100%;height:6px;background:var(--muted-soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:2px}
.empty{text-align:center;padding:48px 24px}
.empty p:first-child{font-size:14px;font-weight:600}
.empty p+p{font-size:14px;color:var(--muted);margin-top:4px}
.field{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line-soft)}
.field span:first-child{color:var(--muted)}
.field span:last-child{text-align:right}
label.f{display:block;margin-bottom:12px}
label.f .lb{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
label.f input,label.f select,label.f textarea{width:100%;padding:6px 10px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.search{display:flex;align-items:center;gap:8px;padding:6px 10px;flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.search input{border:none;background:none;outline:none;width:100%;font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select{padding:6px 10px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(22,33,29,.4)}
.drawer .sheet{width:420px;max-width:100%;height:100%;overflow-y:auto;padding:20px;background:var(--card)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;padding:10px 16px;font-size:14px;background:var(--ink);color:var(--paper);border-radius:3px;max-width:90vw;box-shadow:0 8px 24px rgba(22,33,29,.25)}
.hero{background:var(--ink);color:var(--paper);padding:22px 24px}
.hero .h{font-family:var(--serif);font-size:27px;margin-top:4px}
.notice{padding:16px 20px;background:var(--amber-soft);border:1px solid var(--amber)}
.rem{display:flex;gap:10px;padding:6px 0}
.rem p{font-size:14px;line-height:1.35}
.rem .m{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.chip{padding:4px 10px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.check{width:17px;height:17px;flex:none;border-radius:3px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.check.on{background:var(--moss);border-color:var(--moss)}
.task{width:100%;display:flex;align-items:center;gap:10px;padding:8px 0;text-align:left;border-bottom:1px solid var(--line-soft)}
.task.done span.t{color:var(--muted);text-decoration:line-through}
.task .t{flex:1;font-size:14px}
.board{display:flex;gap:12px;min-width:780px}
.col{flex:1;background:var(--card);border:1px solid var(--line)}
.col>div:first-child{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line-soft);font-size:14px;font-weight:600}
.col .body{padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.cand{padding:10px;background:var(--paper);border-radius:3px}
.mini{padding:2px 6px;font-size:12px;border:1px solid var(--line);border-radius:3px}
.orgnode{padding-left:14px;border-left:1px solid var(--line);margin-left:20px}
.orgnode.root{padding-left:0;border-left:none;margin-left:0}
.orgrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.you{color:var(--moss);font-size:12px;margin-left:6px}
</style>
</head>

/* ============================================ date + money helpers
   Everything below is derived from the moment the page loads, so this
   demo never goes stale. Refresh it in six months and the timesheets,
   payroll periods and review cycle all move with the calendar. */
const NOW = new Date();
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth() + n, 1); return x; };
const yearsAgo = y => iso(addDays(NOW, -Math.round(y * 365.25)));
const daysAgo = n => iso(addDays(NOW, -n));
const TODAY = iso(NOW);

const isWeekday = d => d.getDay() % 6 !== 0;
const bizBack = n => { const out = []; let d = new Date(NOW); while (out.length < n){ d = addDays(d, -1); if (isWeekday(d)) out.push(iso(d)); } return out.reverse(); };
const bizFwd  = n => { let d = new Date(NOW), c = 0; while (c < n){ d = addDays(d, 1); if (isWeekday(d)) c++; } return iso(d); };

const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const NOW_TIME = hhmm(NOW);
/* a plausible clock-in this morning: N minutes ago, but never before 08:20 and never in the future */
function inTime(minsAgo){
  const floor = new Date(NOW); floor.setHours(8, 20, 0, 0);
  const cap = new Date(NOW.getTime() - 5 * 60000);
  let t = new Date(NOW.getTime() - minsAgo * 60000);
  if (t < floor) t = floor;
  if (t > cap) t = cap;
  return hhmm(t);
}
const LOC = undefined; // use the visitor's own locale for dates
const fdate = s => new Date(s + 'T00:00:00').toLocaleDateString(LOC, {day:'numeric', month:'short', year:'numeric'});
const fshort = s => new Date(s + 'T00:00:00').toLocaleDateString(LOC, {day:'numeric', month:'short'});
const monthLabel = d => d.toLocaleDateString(LOC, {month:'long', year:'numeric'});
const endOfMonth = d => new Date(d.getFullYear(), d.getMonth() + 1, 0);
/* birthday on a given offset from today, in a chosen birth year */
const bdayIn = (offset, year) => { const d = addDays(NOW, offset); return `${year}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function daysToBirthday(b){
  const d = new Date(b + 'T00:00:00');
  let next = new Date(NOW.getFullYear(), d.getMonth(), d.getDate());
  const t = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  if (next < t) next = new Date(NOW.getFullYear() + 1, d.getMonth(), d.getDate());
  return Math.round((next - t) / 864e5);
}
const money = n => '₱' + Math.round(n).toLocaleString('en-PH');
const compact = n => n >= 1e6 ? '₱' + (n / 1e6).toFixed(2) + 'M' : '₱' + Math.round(n / 1000) + 'k';

/* ============================================== attendance */
function seedAttendance(){
  const rows = [], days = bizBack(5);
  const pat = [['09:02','17:34'],['08:51','17:12'],['09:14','18:02'],['08:58','17:45'],['09:26','17:20']];
  let id = 1;
  EMPLOYEES.forEach(e => days.forEach((d, i) => {
    if (d < e.hireDate) return;
    const [ci, co] = pat[(e.id + i) % pat.length];
    rows.push({id:id++, empId:e.id, date:d, in:ci, out:co, hours:8.2, status: ci > '09:15' ? 'Late' : 'On time'});
  }));
  rows.push({id:id++, empId:2, date:TODAY, in:inTime(205), out:null, hours:null, status:'Clocked in'});
  rows.push({id:id++, empId:3, date:TODAY, in:inTime(180), out:null, hours:null, status:'Clocked in'});
  rows.push({id:id++, empId:5, date:TODAY, in:inTime(95),  out:null, hours:null, status:'Late'});
  return rows;
}

/* ================================================= payroll
   Gross is computed from the actual salary column, so editing a salary
   above keeps the payroll page consistent. */
function seedPayroll(){
  const runs = [];
  const activeGross = EMPLOYEES.reduce((s, e) => s + e.salary, 0) / 12;
  for (let i = 0; i < 4; i++){
    const m = addMonths(new Date(NOW.getFullYear(), NOW.getMonth(), 1), -i);
    const shrink = i >= 2 ? 0.93 : 1;                 // the team was smaller a few months back
    const gross = Math.round(activeGross * shrink);
    const tax = Math.round(gross * 0.22);
    const benefits = Math.round(gross * 0.0625);
    runs.push({
      id: i + 1, period: monthLabel(m), pay: iso(endOfMonth(m)),
      gross, tax, benefits, net: gross - tax - benefits,
      headcount: EMPLOYEES.length - (i >= 2 ? 1 : 0),
      status: i === 0 ? 'Draft' : 'Paid'
    });
  }
  return runs;
}

/* ================================================= charts */
function barChart(data){
  const W = 320, H = 170, padL = 26, max = Math.max(...data.map(d => d.value), 1);
  const bw = (W - padL - 8) / data.length;
  const bars = data.map((d, i) => {
    const h = (d.value / max) * (H - 34), x = padL + i * bw + bw * .18, y = H - 22 - h;
    return `<rect x="${x}" y="${y}" width="${bw*.64}" height="${h}" fill="${i%2?'var(--moss)':'var(--ink)'}" rx="2"/>
      <text x="${x+bw*.32}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(d.label)}</text>
      <text x="${x+bw*.32}" y="${y-4}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.value}</text>`;
  }).join('');
  const grid = [0,.5,1].map(f => { const y = H - 22 - f * (H - 34);
    return `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line-soft)"/><text x="0" y="${y+3}" font-size="9" fill="var(--muted)">${Math.round(max*f)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${bars}</svg>`;
}
function lineChart(data){
  const W = 320, H = 170, padL = 26, max = Math.max(...data.map(d => d.headcount)) + 1;
  const x = i => padL + (i * (W - padL - 10)) / (data.length - 1);
  const y = v => H - 22 - (v / max) * (H - 34);
  const path = k => data.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d[k])}`).join(' ');
  const dots = (k, c) => data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d[k])}" r="2.6" fill="${c}"/>`).join('');
  const grid = [0,.5,1].map(f => { const gy = H - 22 - f * (H - 34);
    return `<line x1="${padL}" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--line-soft)"/><text x="0" y="${gy+3}" font-size="9" fill="var(--muted)">${Math.round(max*f)}</text>`;
  }).join('');
  const labels = data.map((d, i) => `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(d.month)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}
    <path d="${path('headcount')}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <path d="${path('exits')}" fill="none" stroke="var(--rose)" stroke-width="2"/>
    ${dots('headcount','var(--ink)')}${dots('exits','var(--rose)')}${labels}</svg>`;
}

/* ============================================== reminders */
function reminders(){
  const out = [], ids = visibleIds();
  S.employees.forEach(e => {
    if (!ids.includes(e.id)) return;
    if (e.contractEnds){
      const d = Math.round((new Date(e.contractEnds + 'T00:00:00') - new Date(TODAY + 'T00:00:00')) / 864e5);
      if (d <= 30) out.push({icon:'warn', tone:'var(--rose)', text:`${e.name}'s contract ends in ${d} days`, meta:`Renew or confirm before ${fdate(e.contractEnds)}`});
    }
    const b = daysToBirthday(e.birthday);
    if (b <= 14) out.push({icon:'cake', tone:'var(--muted)', text: b === 0 ? `${e.name}'s birthday is today` : `${e.name}'s birthday in ${b} day${b>1?'s':''}`, meta:'Team reminder'});
    if (e.status === 'Onboarding'){
      const d = Math.round((new Date(TODAY + 'T00:00:00') - new Date(e.hireDate + 'T00:00:00')) / 864e5);
      out.push({icon:'clipboard', tone:'var(--amber)', text:`${e.name} is on day ${d} of onboarding`, meta:'Probation review due at day 90'});
    }
  });
  const pending = S.leave.filter(l => l.status === 'Pending' && ids.includes(l.empId)).length;
  if (pending && S.role !== 'employee')
    out.push({icon:'calendar', tone:'var(--amber)', text:`${pending} leave request${pending>1?'s':''} waiting on you`, meta:'Oldest has been open four days'});
  return out;
}

function vAttendance(){

  const rows = S.attendance.filter(a => ids.includes(a.empId)).sort((a,b) => b.date.localeCompare(a.date) || a.empId - b.empId);
  const mine = S.attendance.find(a => a.empId === me.id && a.date === TODAY);
  const todayRows = rows.filter(r => r.date === TODAY);
  const worked = rows.filter(r => r.hours);

const VIEWS = {dashboard:vDashboard, people:vPeople, org:vOrg, attendance:vAttendance, leave:vLeave,

function render(){
  const nav = NAV.filter(n => n.roles.includes(S.role));
  if (!nav.some(n => n.key === S.view)) S.view = 'dashboard';
  const heading = (nav.find(n => n.key === S.view) || {}).label || '';
  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <aside class="rail${S.navOpen ? ' drawer-open' : ''}">${railHTML()}</aside>
      ${S.navOpen ? `<div class="scrim" data-act="navClose"></div>` : ''}
      <main class="main">
        <header class="topbar">
          <button class="burger" data-act="navOpen">${icon('menu',20)}</button>
          <h1>${esc(heading)}</h1>
          <span class="row sub" style="gap:6px">${icon('bell',14)}${reminders().length}</span>
          <span class="sub datestamp num">${NOW.toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span>
        </header>
        <div class="content">${VIEWS[S.view]()}</div>
      </main>
    </div>
    ${drawerHTML()}
    ${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}`;
  if (S.focus){
    const el = document.getElementById(S.focus);
    if (el){ el.focus(); const v = el.value; el.value = ''; el.value = v; }

}

/* ================================================= events */
document.addEventListener('click', ev => {
  const stop = ev.target.closest('[data-stop]');
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (stop && el.classList.contains('drawer')) return;
  const [act, a, b] = el.dataset.act.split(':');
  const me = actor();

  if (act === 'role'){ S.role = a; S.drawer = null; S.navOpen = false; }
  else if (act === 'view'){ S.view = a; S.navOpen = false; }
  else if (act === 'navOpen'){ S.navOpen = true; }
  else if (act === 'navClose'){ S.navOpen = false; }
  else if (act === 'closeDrawer'){ S.drawer = null; }
  else if (act === 'drawer'){ S.drawer = {type:a, id: b ? Number(b) : null}; }
  else if (act === 'org'){ S.orgClosed[a] = !S.orgClosed[a]; }
  else if (act === 'doccat'){ S.docCat = el.textContent.trim(); }
  else if (act === 'say'){ say(el.dataset.act.slice(4)); }
  else if (act === 'clock'){
    const open = S.attendance.find(x => x.empId === me.id && x.date === TODAY && !x.out);
    const now = hhmm(new Date());
    if (open){
      const [h1,m1] = open.in.split(':').map(Number), [h2,m2] = now.split(':').map(Number);
      const hrs = Math.max(0.1, ((h2*60+m2) - (h1*60+m1)) / 60);
      open.out = now; open.hours = Number(hrs.toFixed(1)); open.status = 'On time';
      say(`Clocked out at ${now}. Today logged as ${open.hours} hours.`);
    } else {
      S.attendance.push({id:Date.now(), empId:me.id, date:TODAY, in:now, out:null, hours:null, status:'Clocked in'});
      say(`Clocked in at ${now}.`);
    }
  }
  else if (act === 'leave'){
    S.leave.find(x => x.id === Number(a)).status = b;
    say(b === 'Approved' ? 'Leave approved. The employee has been notified.' : 'Leave declined. The employee has been notified.');
  }
  else if (act === 'task'){
    const f = S.lifecycle.find(x => x.id === Number(a));
    const t = f.tasks.find(x => x.id === Number(b));
    t.done = !t.done;
  }
  else if (act === 'cand'){
    const c = S.candidates.find(x => x.id === Number(a));
    c.stage = STAGES[Math.max(0, Math.min(STAGES.length - 1, STAGES.indexOf(c.stage) + Number(b)))];
  }
  else if (act === 'payroll'){
    S.payroll.find(p => p.id === Number(a)).status = 'Paid';
    say('Payroll approved. Payslips are now visible to employees.');
  }
  else if (act === 'addEmp'){
    const f = S.newEmp;
    S.employees.push({...f, id: Math.max(...S.employees.map(e => e.id)) + 1, managerId:1, status:'Onboarding',
      salary:840000, type:'Full-time', birthday:bdayIn(200,1996), contractEnds:null, leave:{annual:20,sick:10,personal:3}});
    S.drawer = null;
    say(`${f.name} added. An onboarding checklist was created automatically.`);
    S.newEmp = {name:'',title:'',dept:'Engineering',email:'',phone:'',location:'BGC, Taguig',hireDate:bizFwd(10)};
  }
  else if (act === 'addLeave'){
    const f = S.newLeave;
    const days = Math.max(1, Math.round((new Date(f.to) - new Date(f.from)) / 864e5) + 1);
    S.leave.unshift({id:Date.now(), empId:me.id, type:f.type, from:f.from, to:f.to, days,
      reason: f.reason || 'No reason given.', status:'Pending'});
    S.drawer = null;
    say('Request sent to your manager.');
  }
  else return;
  render();
});

document.addEventListener('input', ev => {
  const k = ev.target.dataset.model;
  if (!k) return;
  const parts = k.split('.');
  if (parts.length === 2) S[parts[0]][parts[1]] = ev.target.value;
  else S[k] = ev.target.value;
  if (ev.target.tagName === 'INPUT' && ev.target.type === 'text' && ev.target.id){
    S.focus = ev.target.id; render(); S.focus = null;
  }
});

document.addEventListener('change', ev => {
  if (ev.target.dataset.model && ev.target.tagName === 'SELECT') render();
});

render();
</script>
</body>
</html>
